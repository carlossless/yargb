on:
  push: {}
  pull_request:
    types: [opened, reopened, synchronize]

name: Build

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@v23
    - name: Setup Nix cache
      uses: DeterminateSystems/magic-nix-cache-action@v15
    - name: Lint
      run: nix develop --command cargo fmt -- --check
    - name: Clippy
      run: nix develop --command cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@v23
    - name: Setup Nix cache
      uses: DeterminateSystems/magic-nix-cache-action@v15
    - name: Test
      run: nix develop --command cargo test

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@v23
    - name: Setup Nix cache
      uses: DeterminateSystems/magic-nix-cache-action@v15
    - name: Build
      run: nix develop --command cargo build --release
    - name: Archive code coverage results
      uses: actions/upload-artifact@v7
      with:
        path: target/release/yargb
